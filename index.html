<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无感艺术</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #247a9256;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .box {
            height: 50px;
            width: 200px;
        }

        @keyframes redNormalBlink {
            0% { filter: none; }
            50% { filter: sepia(1) hue-rotate(-55deg) saturate(2); }
            100% { filter: none; }
        }
    </style>
</head>
<body>
    <img src="顶层.png" style="width: 100%;height:500px;display:block;object-fit:fill;animation:redNormalBlink 1s infinite;">

    <div style="width:100%; display:flex; gap:16px; align-items:center; justify-content:flex-start; flex-wrap:wrap; flex:1; padding:20px 0;">
    <div style="text-align:center;">
        <iframe src="https://player.bilibili.com/player.html?bvid=BV1Bfi9BuE86&danmaku=0&autoplay=0" width="240" height="135" scrolling="no" frameborder="no" allowfullscreen="true"></iframe>
        <p style="margin:4px 0 0 0; font-size:14px;">禁忌姐妹百合</p>
    </div>
    <div style="text-align:center;">
        <iframe src="https://player.bilibili.com/player.html?bvid=BV1kWVB67EyS&danmaku=0&autoplay=0" width="240" height="135" scrolling="no" frameborder="no" allowfullscreen="true"></iframe>
        <p style="margin:4px 0 0 0; font-size:14px;">学生会长强制爱二三事</p>
    </div>
    <div style="text-align:center;">
        <iframe src="https://player.bilibili.com/player.html?bvid=BV1Yx6dB5Ezs&danmaku=0&autoplay=0" width="240" height="135" scrolling="no" frameborder="no" allowfullscreen="true"></iframe>
        <p style="margin:4px 0 0 0; font-size:14px;">作为阴角的我怎么可能是你们的白月光</p>
    </div>
    <div style="text-align:center;">
        <iframe src="https://player.bilibili.com/player.html?bvid=BV1PVcvzxE2P&danmaku=0&autoplay=0" width="240" height="135" scrolling="no" frameborder="no" allowfullscreen="true"></iframe>
        <p style="margin:4px 0 0 0; font-size:14px;">被阴冷水鬼缠上怎么办</p>
    </div>
    <div style="text-align:center;">
        <iframe src="https://player.bilibili.com/player.html?bvid=BV1T64q6REQ4&danmaku=0&autoplay=0" width="240" height="135" scrolling="no" frameborder="no" allowfullscreen="true"></iframe>
        <p style="margin:4px 0 0 0; font-size:14px;">天上掉下个吉他手</p>
    </div>
    </div>

    <div style="margin-top: auto; padding: 30px 20px; display: flex; justify-content: center;">
        <div style="display: flex; align-items: center; gap: 14px;">
            <img src="樱羽艾玛.jpg" alt="头像" width="60" height="60" style="border-radius: 50%; object-fit: cover;">

            <div>
                <p style="color:rgba(8,149,255,0.575); font-size: 13px; margin: 0 0 4px 0;">你好我是<b>樱羽艾玛</b></p>
                <p style="font-size: 13px; margin: 0;">这是我的个人网站，欢迎来到我的网站</p>
            </div>
        </div>
    </div>
</body>
</html>
